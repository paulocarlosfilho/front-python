name: CI/CD Pipeline - Frontend Python (React)

on:
  push:
    branches:
      - main

jobs:
  ci:
    name: Continuous Integration & Validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ./package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        run: npm run build

  cd:
    name: Continuous Delivery & Registry Push
    needs: [ci]
    if: ${{ always() && contains(needs.*.result, 'success') && !(contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to Container Registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_PYTHON_FRONTEND_LOGIN }}
          password: ${{ secrets.DOCKER_PYTHON_FRONTEND_PASSWORD }}

      - name: Build and Push to Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_PYTHON_FRONTEND_LOGIN }}/front-python:latest
            ${{ secrets.DOCKER_PYTHON_FRONTEND_LOGIN }}/front-python:1.0.${{ github.run_number }}
            ${{ secrets.DOCKER_PYTHON_FRONTEND_LOGIN }}/front-python:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max